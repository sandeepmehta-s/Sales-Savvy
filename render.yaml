# render.yaml — ShopSphere Render Deployment
# https://render.com/docs/blueprint-spec

services:

  # Backend: Spring Boot (Docker)
  - type: web
    name: shopsphere-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SELF_URL
        sync: false           # Set this to https://shopsphere-backend.onrender.com
      - key: MONGODB_URI
        sync: false           # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: STRIPE_SECRET_KEY
        sync: false           # sk_live_...
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false           # pk_live_...
      - key: STRIPE_WEBHOOK_SECRET
        sync: false           # whsec_...
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # https://shopsphere-frontend.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # Frontend: React/Vite (Static Site)
  - type: web
    name: shopsphere-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false           # https://shopsphere-backend.onrender.com
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false           # pk_live_...
    routes:
      - type: rewrite
        source: /*
        destination: /index.html