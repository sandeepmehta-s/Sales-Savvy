# render.yaml — Sales-Savvy Render Deployment Config
# Docs: https://render.com/docs/blueprint-spec

services:

  # Backend: Spring Boot (Docker Web Service)
  - type: web
    name: sales-savvy-backend
    runtime: docker
    rootDir: sales-savvy-be
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /auth/test
    envVars:
      # Database (PlanetScale / Railway MySQL) — set in Render dashboard
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      # Razorpay — set in Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # CORS — set to frontend URL after first deploy
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Admin
      - key: ADMIN_PASSWORD
        sync: false
      # Spring prod profile
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # Frontend: React/Vite (Static Site)
  - type: web
    name: sales-savvy-frontend
    runtime: static
    rootDir: sales_savvy_fr
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      # Set to backend Render URL after backend deploys
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback — React Router handles all routes
      - type: rewrite
        source: /*
        destination: /index.html