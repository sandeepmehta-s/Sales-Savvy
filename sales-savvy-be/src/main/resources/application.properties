# ====================
# SERVER CONFIGURATION
# ====================
server.port=8080
server.servlet.context-path=/

# ====================
# DATABASE CONFIGURATION
# ====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecom?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================
# JPA/HIBERNATE CONFIGURATION - CHANGED TO UPDATE
# ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====================
# JWT CONFIGURATION
# ====================
jwt.secret=${JWT_SECRET:change-this-development-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ====================
# RAZORPAY CONFIGURATION
# ====================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ====================
# LOGGING - REDUCED
# ====================
logging.level.com.salesSavvy=INFO
logging.level.org.hibernate.SQL=INFO

# ====================
# APPLICATION NAME
# ====================
spring.application.name=sales-savvy

# ====================
# CORS CONFIGURATION
# Bug Fix #5: Override cors.allowed-origins in production environment
# Multiple origins can be set as comma-separated values in .env
# e.g. cors.allowed-origins=https://your-prod-domain.com,https://www.your-prod-domain.com
# ====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}