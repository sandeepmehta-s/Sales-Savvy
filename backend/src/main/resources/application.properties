# SERVER
server.port=8080
server.servlet.context-path=/

# MONGODB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shopsphere}
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET:change-this-development-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# STRIPE
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# LOGGING
logging.level.com.shopSphere=INFO

# APP
spring.application.name=shopsphere

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
